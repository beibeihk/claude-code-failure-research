[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-code-failure-research"
version = "0.1.0"
description = "Reproducible reliability experiments and failure analysis for coding agents"
requires-python = ">=3.10"
license = {file = "LICENSE"}
readme = "README.md"

[project.optional-dependencies]
dev = ["jsonschema>=4"]

[tool.setuptools.packages.find]
include = ["analyzers*", "runners*"]
